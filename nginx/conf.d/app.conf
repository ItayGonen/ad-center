# app.leadsadv.com — HTTP → HTTPS redirect
server {
    listen 80;
    server_name app.leadsadv.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# app.leadsadv.com — HTTPS
server {
    listen 443 ssl;
    server_name app.leadsadv.com;

    ssl_certificate     /etc/letsencrypt/live/app.leadsadv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.leadsadv.com/privkey.pem;

    # API → backend-app
    location /api/ {
        proxy_pass http://backend-app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads served from backend
    location /uploads/ {
        proxy_pass http://backend-app:8000/uploads/;
        proxy_set_header Host $host;
    }

    # Frontend SPA
    location / {
        proxy_pass http://frontend-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
