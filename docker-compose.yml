version: "3.8"

services:
  # ─── MySQL ───────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env.shared
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend: app ────────────────────────────────────
  backend-app:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env.shared
      - .env.app
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/ad_booking_app
    volumes:
      - uploads_app:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  # ─── Backend: demo ───────────────────────────────────
  backend-demo:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env.shared
      - .env.demo
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/ad_booking_demo
    volumes:
      - uploads_demo:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  # ─── Frontend: app ───────────────────────────────────
  frontend-app:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://app.leadsadv.com/api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped

  # ─── Frontend: demo ──────────────────────────────────
  frontend-demo:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://demo.leadsadv.com/api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped

  # ─── Nginx reverse proxy ─────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend-app
      - backend-demo
      - frontend-app
      - frontend-demo

  # ─── Certbot SSL ─────────────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  mysql_data:
  uploads_app:
  uploads_demo:
  certbot_webroot:
  certbot_certs:
